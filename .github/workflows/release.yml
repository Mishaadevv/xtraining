name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22+ : the tests that boot the packed build use the built-in
          # WebSocket client, which is only stable from 22.4.
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check that the lock file covers every platform
        run: npm run check:lock

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify before packaging
        run: |
          npm run typecheck
          python python/tests/test_engine.py

      # `dist/` is not in the repository, so the renderer has to be built here —
      # electron-builder packages `dist/**/*`, and without this step every
      # installer would ship an application with no interface. The packed-build
      # test on Windows is what caught that; the other platforms merely produced
      # a smaller, empty app.
      - name: Build the renderer
        run: npm run build

      - name: Build installers
        shell: bash
        # Signing is optional: provide CSC_LINK and CSC_KEY_PASSWORD as secrets
        # and ZEQOUX_PUBLISHER as a variable, and the same certificate that signs
        # the build is named in app-update.yml, which is what makes updates from
        # this build trusted. Without them the build is simply unsigned.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          ZEQOUX_PUBLISHER: ${{ vars.ZEQOUX_PUBLISHER }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          args=(--publish never)
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "${CSC_LINK:-}" ] && [ -n "${ZEQOUX_PUBLISHER:-}" ]; then
            args+=("-c.win.signtoolOptions.publisherName=$ZEQOUX_PUBLISHER")
          else
            # Signing here is Windows-only: the certificate these secrets carry is a
            # .pfx, and macOS cannot use one. More importantly, an *empty* CSC_LINK is
            # not "no certificate" to electron-builder — it resolves the empty path
            # against the project directory and dies with
            # "<project dir> not a file", which is how the macOS build failed. So the
            # variables are removed from the environment unless they are really used.
            # macOS and Linux artifacts are unsigned.
            unset CSC_LINK CSC_KEY_PASSWORD
          fi
          npx electron-builder ${{ matrix.target }} "${args[@]}" 2>&1 | tee builder-output.log

      # The same verification CI runs, against the artifacts that are about to be
      # published rather than against a local build.
      - name: Verify the packed build
        if: runner.os == 'Windows'
        run: npm run verify:packed
      - name: Verify the update channel
        if: runner.os == 'Windows'
        run: npm run verify:update

      # A failed release has to be understood without a signed-in reader: the tail
      # of the builder output is published as an annotation on the run page.
      - name: Say what failed where it can be read
        if: failure()
        shell: bash
        run: |
          node -e '
          const fs = require("fs");
          const lines = [];
          if (fs.existsSync("builder-output.log")) {
            lines.push("electron-builder (last 25 lines):");
            lines.push(...fs.readFileSync("builder-output.log", "utf8").split(/\r?\n/).filter(Boolean).slice(-25));
          }
          const message = lines.map((line) => line.replace(/%/g, "%25")).join("%0A").slice(0, 1500);
          if (message) console.log(`::error title=what failed::${message}`);
          '

      # Only the distributables, never `release/**`: the release step uploads every
      # file under its base name, and the unpacked trees of three platforms collide
      # on `app.asar`, `builder-debug.yml` and the rest — which is what made the
      # release fail with a duplicate asset. These patterns also carry the update
      # manifests (`latest*.yml`) the installed app reads.
      - name: Upload the distributables
        uses: actions/upload-artifact@v4
        with:
          name: ZeqouXTraining-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
            release/latest-linux.yml
          if-no-files-found: warn

  publish:
    name: Attach builds to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
