name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Runs on every trigger so a broken commit cannot be packaged into a release.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Python backend tests
        working-directory: python
        run: python3 tests/test_backend.py

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Build distributables
        run: npx electron-builder --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xtraining-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: Create release and attach files
        uses: softprops/action-gh-release@v2
        with:
          name: ZeqouXTraining ${{ github.ref_name }}
          body: |
            Cross-platform release.

            **Windows:** Setup .exe (installer) and portable .exe
            **macOS:** .dmg and .zip (x64 and Apple Silicon)
            **Linux:** .AppImage and .deb (x64)

            Training and inference need an ML runtime, which is **not** bundled — it is
            machine-specific and several gigabytes. The app detects what is missing and
            generates the exact install command in Settings → Environment.

            Licensed under PolyForm Strict 1.0.0 (see the repository).
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.AppImage
            artifacts/*.deb
          fail_on_unmatched_files: true
