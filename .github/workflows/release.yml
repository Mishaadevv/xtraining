name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify before packaging
        run: |
          npm run typecheck
          python python/tests/test_engine.py

      - name: Build installers
        shell: bash
        # Signing is optional: provide CSC_LINK and CSC_KEY_PASSWORD as secrets
        # and ZEQOUX_PUBLISHER as a variable, and the same certificate that signs
        # the build is named in app-update.yml, which is what makes updates from
        # this build trusted. Without them the build is simply unsigned.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          ZEQOUX_PUBLISHER: ${{ vars.ZEQOUX_PUBLISHER }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          args=(--publish never)
          if [ -n "$CSC_LINK" ] && [ -n "$ZEQOUX_PUBLISHER" ]; then
            args+=("-c.win.signtoolOptions.publisherName=$ZEQOUX_PUBLISHER")
          fi
          npx electron-builder ${{ matrix.target }} "${args[@]}"

      - name: Verify the installers that will be published
        if: runner.os == 'Windows'
        run: |
          npm run verify:packed
          npm run verify:update

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZeqouXTraining-${{ matrix.os }}
          path: |
            release/**
          if-no-files-found: warn

  publish:
    name: Attach builds to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
