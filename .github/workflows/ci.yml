name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine tests (${{ matrix.os }} · python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the engine test suite
        run: python python/tests/test_engine.py
      - name: Report engine command surface
        run: python -m zxtrain.cli --help
        env:
          PYTHONPATH: python
        continue-on-error: true

  app:
    name: Typecheck, build and smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The packed-app tests drive the app over its DevTools socket with the
          # WebSocket client that is built into Node; it was experimental until
          # 22.4, so Node 20 would fail there instead of testing the app.
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the lock file covers every platform
        run: npm run check:lock
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build the renderer
        run: npm run build
      # `tee` keeps what the Electron binary itself printed — a missing shared
      # library, a sandbox refusal — next to the checks the script logs, so the
      # annotation below can say why it failed and not only that it did.
      - name: Smoke test the desktop app
        shell: bash
        env:
          ZEQOUX_SMOKE_LOG: ${{ github.workspace }}/smoke.log
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum npx electron scripts/smoke.mjs 2>&1 | tee smoke-output.log
          else
            npx electron scripts/smoke.mjs 2>&1 | tee smoke-output.log
          fi
      - name: Launch the app and walk every page
        shell: bash
        env:
          ZEQOUX_LAUNCH_LOG: ${{ github.workspace }}/launch.log
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum npx electron scripts/launch.mjs 2>&1 | tee launch-output.log
          else
            npx electron scripts/launch.mjs 2>&1 | tee launch-output.log
          fi
      # Kept as separate steps so a failure names the command that failed.
      - name: Package the installers
        if: runner.os == 'Windows'
        run: node scripts/dist.mjs --no-build
      - name: Verify the packed build
        if: runner.os == 'Windows'
        run: npm run verify:packed
      - name: Verify the update channel
        if: runner.os == 'Windows'
        run: npm run verify:update
      - name: Show the logs
        if: always()
        shell: bash
        run: |
          cat smoke.log || true
          cat launch.log || true

      # The job log needs a signed-in reader. A failed check also publishes the
      # tail of its own log as an annotation, which is readable from the run page
      # — which is how the check that failed can be understood at a glance.
      - name: Say what failed where it can be read
        if: failure()
        shell: bash
        run: |
          node -e '
          const fs = require("fs");
          const files = process.argv.slice(1).filter((file) => fs.existsSync(file));
          const lines = [];
          for (const file of files) {
            lines.push(`${file} (last 25 lines):`);
            lines.push(...fs.readFileSync(file, "utf8").split(/\r?\n/).filter(Boolean).slice(-25));
          }
          const message = lines.map((line) => line.replace(/%/g, "%25")).join("%0A").slice(0, 1500);
          if (message) console.log(`::error title=what failed::${message}`);
          ' smoke-output.log launch-output.log smoke.log launch.log
      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.os }}
          path: |
            smoke.log
            launch.log
            smoke-output.log
            launch-output.log
          if-no-files-found: ignore
